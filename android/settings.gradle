rootProject.name = 'mte_socketx'

// Dev-only composite: build against the checked-out sibling lib when present;
// otherwise the declared com.eclypses:* artifact resolves from Maven Central.
if (file('../../../Packages/mte-socketx-client-android').exists()) {
    includeBuild('../../../Packages/mte-socketx-client-android') {
        dependencySubstitution {
            substitute module('com.eclypses:mte-socketx-client-android') using project(':socketx')
        }
    }
}
